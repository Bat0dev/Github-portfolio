<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batu Özkan — Technical Artist</title>
  <meta name="description" content="Portfolio of Batu Özkan: games, shaders, rigging and 3D.">
  <meta property="og:title" content="Batu Özkan — Technical Artist">
  <meta property="og:description" content="Games, shaders, rigging and 3D.">
  <meta name="theme-color" content="#0c0c0e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='%23ff6a2b'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="logo"><span class="logo-mark" aria-hidden="true"></span><span id="logo-name">Batu Özkan</span></a>
      <nav aria-label="Main">
        <ul class="nav-links">
          <li><a href="#about">About</a></li>
          <li><a href="#work">Work</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="top">
      <canvas id="shader" aria-hidden="true"></canvas>
      <div class="container hero-inner">
        <p class="eyebrow mono">// portfolio</p>
        <h1 id="hero-name">Batu Özkan</h1>
        <p class="hero-role" id="hero-role"></p>
        <p class="hero-tagline" id="hero-tagline"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#work">See my work</a>
          <a class="btn btn-ghost" href="#contact">Get in touch</a>
        </div>
      </div>
      <div class="hero-meta mono" aria-hidden="true">fbm · domain warp</div>
    </section>

    <section id="about" class="container section">
      <p class="section-label">// 01</p>
      <h2 class="about-title" id="about-heading">Who are you?</h2>
      <div class="about-row">
        <div class="about-photos" id="about-photos"></div>
        <div class="about-body">
          <div id="about-text"></div>
          <ul class="skills" id="skills"></ul>
        </div>
      </div>
    </section>

    <section id="work" class="container section">
      <div class="section-head">
        <div>
          <p class="section-label">// 02</p>
          <h2>Projects</h2>
        </div>
        <div class="filters" id="filters" aria-label="Filter projects"></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="contact" class="container section contact">
      <p class="section-label">// 03</p>
      <h2>Need 3D Models, Shaders or VFX? <span class="accent">Let's talk.</span></h2>
      <div class="contact-links" id="contact-links"></div>
    </section>
  </main>

  <footer class="container footer">
    <span>© <span id="year"></span> <span id="footer-name">Batu Özkan</span></span>
    <span class="mono">plain HTML, CSS &amp; one fragment shader</span>
  </footer>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <button class="modal-close" type="button" aria-label="Close" data-close>&times;</button>
    <div id="modal-content"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
